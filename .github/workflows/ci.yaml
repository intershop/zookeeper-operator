# workflow name
name: CI

# on events
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - created

# jobs to run
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.21
      uses: actions/setup-go@v2
      with:
        go-version: "1.21"
      id: go
    - name: Set up Go for root
      run: |
        sudo ln -sf `which go` `sudo which go` || true
        sudo go version
    - name: Check out code into the Go module directory
      uses: actions/checkout@v2
    - name: get go version
      run: go version
    - name: Gofmt and License checks
      run: make check
    - name: unit tests
      run: make test
    - name: Codecov
      uses: codecov/codecov-action@v1.0.12
    - name: Start minikube
      uses: medyagh/setup-minikube@v0.0.21
      with:
        minikube-version: 1.39.0
        kubernetes-version: v1.35.7
        driver: docker
        container-runtime: containerd
        wait: true
    - name: Check the cluster
      run: |
        kubectl version
        kubectl get nodes
    - name: minikube setup
      run: |
        kubectl create clusterrolebinding add-on-cluster-admin --clusterrole=cluster-admin --serviceaccount=kube-system:default
        echo "created cluster role"
        kubectl cluster-info
        echo "cluster info"
        kubectl -n kube-system get pod -o wide
    - name: Create Docker registry secret for test
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        DOCKER_EMAIL: ${{ secrets.DOCKER_EMAIL }}
      run: |
        kubectl create secret docker-registry regcred \
          --docker-server=https://index.docker.io/v1/ \
          --docker-username="$DOCKER_USERNAME" \
          --docker-password="$DOCKER_PASSWORD" \
          --docker-email="$DOCKER_EMAIL"
    - name: E2E
      run: make test-e2e
    - name: E2E diagnostics
      if: always()
      run: |
        set +e

        echo "=== Context ==="
        kubectl config current-context
        kubectl get nodes -o wide

        echo "=== All resources in default ==="
        kubectl get all -n default -o wide

        echo "=== All pods with labels ==="
        kubectl get pods -A -o wide --show-labels

        echo "=== ZookeeperCluster objects ==="
        kubectl get zookeeperclusters -A -o yaml

        echo "=== StatefulSets ==="
        kubectl get statefulsets -A -o yaml

        echo "=== PVCs ==="
        kubectl get pvc -A -o wide

        echo "=== Events ==="
        kubectl get events -A --sort-by=.lastTimestamp

        echo "=== Pod descriptions ==="
        for pod in $(kubectl get pods -A -o name); do
          echo "=== $pod ==="
          kubectl describe "$pod"
        done

        echo "=== Container logs ==="
        for pod in $(kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}'); do
          namespace=$(echo "$pod" | awk '{print $1}')
          name=$(echo "$pod" | awk '{print $2}')
          echo "=== $namespace/$name ==="
          kubectl logs "$name" -n "$namespace" --all-containers=true --ignore-errors=true
        done

        echo "=== Previous logs for default/zookeeper-0 ==="
        kubectl logs pod/zookeeper-0 -n default -c zookeeper --previous || true

        echo "=== Pod logs with all containers ==="
        kubectl get pods -A \
          -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name' \
          --no-headers |
        while read -r namespace name; do
          echo "=== $namespace/$name ==="
          kubectl logs "$name" -n "$namespace" \
            --all-containers=true --tail=-1 || true
          kubectl logs "$name" -n "$namespace" \
            --all-containers=true --previous --tail=-1 || true
        done
