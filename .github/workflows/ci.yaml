# workflow name
name: CI

# on events
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      run_e2e_diagnostics:
        description: Run E2E tests with periodic Zookeeper diagnostics
        required: false
        type: boolean
        default: false

# jobs to run
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.26.8
      uses: actions/setup-go@v2
      with:
        go-version: "1.26.8"
      id: go
    - name: Set up Go for root
      run: |
        sudo ln -sf `which go` `sudo which go` || true
        sudo go version
    - name: Check out code into the Go module directory
      uses: actions/checkout@v2
    - name: get go version
      run: go version
    - name: Gofmt and License checks
      run: make check
    - name: unit tests
      run: make test
    - name: Codecov
      uses: codecov/codecov-action@v1.0.12
    - name: Start minikube
      uses: medyagh/setup-minikube@v0.0.21
      with:
        minikube-version: 1.39.0
        kubernetes-version: v1.35.7
        driver: docker
        container-runtime: docker
        wait: true
    - name: Check the cluster
      run: |
        kubectl version
        kubectl get nodes
    - name: minikube setup
      run: |
        kubectl create clusterrolebinding add-on-cluster-admin --clusterrole=cluster-admin --serviceaccount=kube-system:default
        echo "created cluster role"
        kubectl cluster-info
        echo "cluster info"
        kubectl -n kube-system get pod -o wide
    - name: Create Docker registry secret for test
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        DOCKER_EMAIL: ${{ secrets.DOCKER_EMAIL }}
      run: |
        kubectl create secret docker-registry regcred \
          --docker-server=https://index.docker.io/v1/ \
          --docker-username="$DOCKER_USERNAME" \
          --docker-password="$DOCKER_PASSWORD" \
          --docker-email="$DOCKER_EMAIL"
    - name: E2E
      if: ${{ !inputs.run_e2e_diagnostics }}
      run: make test-e2e
    - name: E2E with diagnostics
      if: ${{ inputs.run_e2e_diagnostics }}
      run: |
        set -o pipefail

        (
          while true; do
            echo "=== $(date -u) ==="
            kubectl get pods -A -o wide || true

            for pod in $(kubectl get pods -n default \
              -l kind=ZookeeperMember \
              -o name 2>/dev/null); do
              echo "=== Current logs: $pod ==="
              kubectl logs "$pod" -n default \
                -c zookeeper --tail=100 || true

              echo "=== Previous logs: $pod ==="
              kubectl logs "$pod" -n default \
                -c zookeeper --previous --tail=100 || true
            done

            sleep 15
          done
        ) &
        diagnostics_pid=$!

        trap 'kill "$diagnostics_pid" 2>/dev/null || true' EXIT

        make test-e2e
  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'release' }}
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Log in to snapshot ACR
      if: ${{ github.event_name == 'push' }}
      uses: azure/docker-login@v2
      with:
        login-server: ${{ vars.SNAPSHOT_ACR_LOGIN_SERVER }}
        username: ${{ secrets.SNAPSHOT_ACR_USERNAME }}
        password: ${{ secrets.SNAPSHOT_ACR_PASSWORD }}
#    - name: Log in to release ACR
#      if: ${{ github.event_name == 'release' }}
#      uses: azure/docker-login@v2
#      with:
#        login-server: ${{ vars.RELEASE_ACR_LOGIN_SERVER }}
#        username: ${{ secrets.RELEASE_ACR_USERNAME }}
#        password: ${{ secrets.RELEASE_ACR_PASSWORD }}
    - name: Build Docker images
      run: |
        make build-image build-zk-image
    - name: Push snapshot images
      if: ${{ github.event_name == 'push' }}
      env:
        ACR_LOGIN_SERVER: ${{ vars.SNAPSHOT_ACR_LOGIN_SERVER }}
        IMAGE_NAMESPACE: ${{ vars.ACR_IMAGE_NAMESPACE || 'pravega' }}
      run: |
        set -euo pipefail
        image_tag="snapshot-${GITHUB_SHA::12}"
        for image in zookeeper-operator zookeeper; do
          docker tag "pravega/${image}:latest" "${ACR_LOGIN_SERVER}/${IMAGE_NAMESPACE}/${image}:${image_tag}"
          docker tag "pravega/${image}:latest" "${ACR_LOGIN_SERVER}/${IMAGE_NAMESPACE}/${image}:latest"
          docker push "${ACR_LOGIN_SERVER}/${IMAGE_NAMESPACE}/${image}:${image_tag}"
          docker push "${ACR_LOGIN_SERVER}/${IMAGE_NAMESPACE}/${image}:latest"
        done
